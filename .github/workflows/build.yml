name: Build APK

# فقط با دستور دستی (Run workflow) — با push ساخته نمی‌شود
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare single APK
        run: |
          CODE=$((2000 + ${{ github.run_number }}))
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=app/build/outputs/apk/debug/AdelAssistant.apk
          cp "$SRC" "$OUT"
          # فقط یک فایل بماند
          find app/build/outputs/apk/debug -type f ! -name 'AdelAssistant.apk' -delete
          ls -la app/build/outputs/apk/debug/
          echo "versionCode=$CODE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdelAssistant-apk
          path: app/build/outputs/apk/debug/AdelAssistant.apk
          if-no-files-found: error
          retention-days: 14
